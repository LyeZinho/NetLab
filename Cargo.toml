[package]
name = "networkscraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "NetworksCraft — an education-first, agent-drivable network lab simulator"
default-run = "networkscraft"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[[bin]]
name = "networkscraft"
path = "src/main.rs"

[[bin]]
name = "networkscraft-cli"
path = "src/bin/networkscraft-cli.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace]
